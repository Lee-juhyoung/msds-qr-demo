<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f3b">
  <meta name="description" content="제품별 MSDS와 QR, 인쇄용 갑지.">
  <title>MSDS 목록</title>
  <link rel="stylesheet" href="styles.css?v=center-1">
  <script src="data.js?v=add-3" defer></script>
  <script src="app.js?v=add-3" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <main class="shell" id="main">
    <header class="page-heading"><h1>MSDS 목록</h1><span class="sample-tag">예시 자료</span></header>
    <section class="library" aria-label="제품 목록">
      <div class="filters">
        <div class="search-field"><label class="sr-only" for="search">제품명·제조사 검색</label><input id="search" type="search" placeholder="제품명·제조사 검색" autocomplete="off"></div>
        <div class="category-field"><label class="sr-only" for="category">제품 분류</label><select id="category"><option value="">전체 분류</option></select></div>
      </div>
      <p class="result-count" id="result-count" role="status" aria-live="polite">자료를 불러오는 중입니다.</p>
      <div class="document-list" id="document-list"></div>
      <p class="empty-state" id="empty-state" hidden>검색 결과가 없습니다.</p>
      <noscript><p class="empty-state">자료 목록을 보려면 JavaScript를 켜 주세요.</p></noscript>
    </section>
    <details class="utility-panel">
      <summary>QR·갑지·안전요약표 다운로드</summary>
      <div class="utility-content">
        <div class="download-links"><a class="button button-secondary" href="downloads/msds-covers.pdf?v=add-3" download>갑지 PDF</a><a class="button button-secondary" href="downloads/msds-safety-summaries.pdf?v=add-3" download>안전요약표 PDF</a><a class="button button-secondary" href="downloads/msds-example.zip?v=add-3" download>전체 ZIP</a></div>
        <div class="qr-detail-content"><img src="qr/all-msds.png?v=center-1" alt="MSDS 전체 목록 QR" width="240" height="240" loading="lazy"><a class="text-link" href="qr/all-msds.png?v=center-1" download="all-msds-qr.png">전체 목록 QR 저장</a></div>
      </div>
    </details>
    <p class="source-note">공식 공개 자료 예시 · 수집일 <span id="checked-at">—</span></p>
  </main>
</body>
</html>
