<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f3b">
  <meta name="description" content="MSDS 원문과 제품별 QR, 인쇄용 갑지.">
  <title>MSDS</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="document.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <main class="shell document-main" id="main">
    <nav class="breadcrumb" aria-label="페이지 경로"><a href="index.html">← 전체 목록</a><span class="sample-tag">예시 자료</span></nav>
    <div id="document-content" hidden>
      <header class="document-heading"><span class="category-tag" id="document-category"></span><h1 id="document-title"></h1><p class="manufacturer" id="document-manufacturer"></p></header>
      <div class="document-main-actions"><a class="button button-primary" id="open-pdf" target="_blank" rel="noopener">PDF 열기<span class="sr-only">(새 탭)</span></a><a class="button button-secondary" id="download-pdf" download>PDF 저장</a></div>
      <details class="utility-panel document-tools">
        <summary>QR·갑지·문서 정보</summary>
        <div class="utility-content document-utilities">
          <div><dl class="metadata"><div><dt>개정일</dt><dd id="revision-date"></dd></div><div><dt>수집일</dt><dd id="collection-date"></dd></div><div><dt>분량</dt><dd id="page-count"></dd></div></dl><a class="text-link" id="official-source" target="_blank" rel="noopener">공식 출처<span class="sr-only">(새 탭)</span></a><div class="cover-link"><a class="text-link" id="open-cover" target="_blank" rel="noopener">인쇄용 갑지<span class="sr-only">(새 탭)</span></a></div></div>
          <div class="qr-detail-content"><img id="product-qr" alt="이 제품의 MSDS QR" width="180" height="180" loading="lazy"><a class="text-link" id="download-qr" download>제품 QR 저장</a></div>
        </div>
      </details>
      <section class="preview-section" aria-label="MSDS 전체 문서"><div class="preview-heading"><h2>MSDS</h2><span class="preview-count" id="preview-count"></span></div><div id="preview-pages" class="preview-pages"></div></section>
    </div>
    <section class="not-found" id="not-found" hidden aria-labelledby="not-found-title"><h1 id="not-found-title">자료를 찾을 수 없습니다.</h1><a class="button button-primary" href="index.html">전체 목록</a></section>
    <noscript><p class="empty-state">자료를 보려면 JavaScript를 켜 주세요.</p></noscript>
  </main>
</body>
</html>
